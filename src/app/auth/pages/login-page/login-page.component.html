<div
  class="min-h-screen w-full bg-gradient-to-br from-finco-bg-color to-finco-card-bg-color flex items-center justify-center p-4"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 flex items-center justify-center">
          <img src="/fincologo-preview.png" alt="Finco Logo" />
        </div>
      </div>
      <h1 class="text-3xl font-bold text-finco-primary-color mb-2">
        Welcome to Finco
      </h1>
      <p class="text-finco-secondary-color">Login to continue</p>
    </div>

    <div
      class="bg-white/10 backdrop-blur-md rounded-2xl p-8 shadow-xl border border-white/5"
    >
      <div class="flex justify-center flex-col space-y-4">
        <button
          type="button"
          (click)="signIn()"
          [disabled]="isRedirecting()"
          class="w-full flex items-center justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-finco-bg-color bg-finco-primary-color hover:bg-finco-primary-color/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-finco-primary-color transition duration-200 disabled:bg-finco-primary-color/50"
        >
          <svg class="h-8 w-8 mr-4">
            <use xlink:href="/sprite.svg#svg-google" />
          </svg>
          @if (isRedirecting()) { Redirecting... } @else { Continue with Google }
        </button>
      </div>

      <p class="mt-6 text-center text-sm text-finco-secondary-color">
        New to Finco? Your account is created the first time you sign in.
      </p>
    </div>
  </div>
</div>
