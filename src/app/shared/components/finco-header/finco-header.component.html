<header class="bg-finco-bg-color flex justify-between items-center w-full fixed top-0 z-100 px-2">
  <a routerLink='/' routerLinkActive="router-link-active"
    class="logo flex p-2 justify-center items-center">
    <img src="/fincologo-preview.png" alt="Finco Logo" class="w-10" />
    <h1 class="text-3xl text-finco-primary-color">Finco</h1>
  </a>

  @if(this.authService.authStatus() === 'authenticated') {
    <div class="flex items-center gap-2 min-w-0">
      <span class="text-finco-primary-color font-bold text-sm sm:text-base truncate max-w-28 sm:max-w-48">{{this.authService.user()?.name}}</span>
      <button
        (click)="this.authService.logout()"
        class="px-3 py-1 bg-finco-button-bg-color rounded-2xl active:bg-finco-primary-color hover:bg-finco-secondary-color transition duration-150 shrink-0"
      >
        <span class="text-finco-bg-color font-bold text-sm">log out</span>
      </button>
    </div>
  } @else {
    <a
      routerLink='/auth/login'
      class="my-2 mx-3 px-4 py-1 bg-finco-button-bg-color rounded-2xl active:bg-finco-primary-color hover:bg-finco-secondary-color transition duration-150"
    >
      <span class="text-finco-bg-color font-bold">log in</span>
    </a>
  }
</header>
