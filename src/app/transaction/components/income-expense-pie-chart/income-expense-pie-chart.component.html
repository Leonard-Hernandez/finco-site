@if (!hasData()) {
  <p class="text-center text-finco-secondary-color text-sm py-4">No income/expense data available</p>
} @else {
  <div class="flex gap-1 justify-center items-center h-full">
      <div class="max-w-45 max-h-45">
          <canvas #incomeChart></canvas>
      </div>
      <div class="max-w-45 max-h-45">
          <canvas #expenseChart></canvas>
      </div>
  </div>
}
