<div
  class="flex flex-col gap-2 items-center min-h-[calc(100vh-7rem)] w-full px-4 py-3 bg-gradient-to-br from-finco-bg-color to-finco-card-bg-color"
>
  <section class="w-full max-w-lg">
    @if (chart()) {
    <app-transaction-chart
      [transactionChartOptions]="transactionChartOptions()"
    />
    } @else {
    <app-income-expense-pie-chart [transactions]="transactions()" />
    }
    <transaction-ranges-buttons [lastTransaction]="lastTransaction()" (range)="updateTransactionFilter($event)" />
  </section>

  <section class="w-full max-w-lg space-y-3">
    <div class="flex gap-4 justify-around">
      <app-toggle-switch
        label="Chart"
        [checked]="chart()"
        (changed)="updateChart()"
      />
      <app-toggle-switch
        label="Goal"
        [checked]="goal()"
        (changed)="updateGoal()"
      />
    </div>

    <div class="grid grid-cols-2 gap-2">
      <app-select-input
        label="Category"
        [values]="categories()!"
        (value)="updateCategory($event)"
      />
      <app-select-input
        label="Account"
        [values]="accounts()!"
        (value)="updateAccountId($event)"
      />
      @if(goal()) {
      <app-select-input
        label="Goal"
        [values]="goals()!"
        (value)="updateGoalId($event)"
      />
      } @else {
      <app-select-input
        label="Account transfer"
        [values]="accounts()!"
        (value)="updateTransferAccountId($event)"
      />
      }
      <app-select-input
        label="Operation"
        [values]="operations()!"
        (value)="updateOperation($event)"
      />
    </div>
  </section>

  <section class="w-full max-w-lg flex-1 flex flex-col gap-2 overflow-y-auto">
    <h2 class="text-finco-secondary-color font-bold">Transactions</h2>
    <div class="flex flex-col gap-2 overflow-y-auto">
      @for (transaction of transactions(); track $index) {
      <app-transaction [transaction]="transaction" />
      }
    </div>
  </section>
</div>
