@if (loading()) {
<app-loading-page />
} @else {
<div
  class="flex flex-col py-4 justify-between items-center min-h-[calc(100vh-7rem)] w-full overflow-x-hidden bg-gradient-to-br from-finco-bg-color to-finco-card-bg-color"
>
  <section class="flex flex-col w-full max-w-lg px-4 font-bold flex-1">
    <h2 class="text-finco-secondary-color">Hi {{ name }}</h2>
    <app-total [_total]="totals()!" />
  </section>

  <section class="flex flex-col gap-2 w-full max-w-lg px-4 flex-2">
    <app-transaction-chart
      [transactionChartOptions]="transactionChartOptions()"
    />
    <transaction-ranges-buttons
      [lastTransaction]="lastTransaction()"
      (range)="updateFilter($event)"
    />
  </section>

  <section class="w-full max-w-lg px-4 flex-2 flex justify-center items-center">
    <app-income-expense-pie-chart [transactions]="transactions.value()!" />
  </section>
</div>
}
