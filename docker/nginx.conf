server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness/readiness endpoint for Kubernetes probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build artifacts (esbuild: name-HASH.ext, 8 uppercase base32 chars) are immutable.
    location ~ "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime configuration written at container startup: never cache it.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
